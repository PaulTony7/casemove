[package]
name = "casemove-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.33.3"
egui_extras = "0.33.3"
egui-phosphor = "0.11"
domain = { path = "crates/domain" }
app-commands = { path = "crates/app-commands" }
pricing = { path = "crates/pricing" }
app-core = { path = "crates/app-core" }
qrcode = { version = "0.14", default-features = false }
image = "0.25"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
serde_json = "1"

[workspace]
members = ["crates/*"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
