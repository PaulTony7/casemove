[package]
name = "casemove-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
app-commands = { path = "crates/app-commands" }
leptos_icons = "0.7.1"
icondata = { version = "0.7", default-features = false, features = ["lucide", "simple-icons"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[workspace]
members = ["src-tauri", "crates/*"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
