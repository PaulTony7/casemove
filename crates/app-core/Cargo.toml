[package]
name = "app-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
settings = { path = "../settings" }
app-commands = { path = "../app-commands" }
steam-core = { path = "../steam-core" }
gc-cs2 = { path = "../gc-cs2" }
item-schema = { path = "../item-schema" }
domain = { path = "../domain" }
pricing = { path = "../pricing" }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-stream = "0.1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
