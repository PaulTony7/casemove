[package]
name = "gc-cs2"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
protobuf = "3.5"
steam-vent-proto-common = "=0.5.1"
steam-vent-proto-csgo = "=0.5.2"
steam-vent = "=0.5.0"
steam-client-rs = "=0.2.0"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["time", "macros", "rt"] }
