[package]
name = "settings"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
keyring = "4.2.0"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
